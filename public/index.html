<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Check in · Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#151b2e', midnight: '#0b1120', paper: '#f1f3f9', brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } },
          boxShadow: { lift: '0 1px 2px rgba(11,17,32,.04), 0 12px 32px -8px rgba(11,17,32,.14)', frame: '0 24px 60px -18px rgba(11,17,32,.45)' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
   .mirror{transform: scaleX(-1)}.face-guide{box-shadow: 0 0 0 9999px rgba(11,17,32,.55) inset; border: 1.5px dashed rgba(255,255,255,.6)}
  </style>
</head>

<body class="min-h-screen bg-[#f8f9ff] text-ink antialiased selection:bg-indigo-500/20">

  <!-- AMAZING NAVBAR -->
  <nav class="sticky top-0 z-50 w-full border-b border-white/10 bg-black/90 backdrop-blur-xl">
    <div class="mx-auto max-w-7xl px-6 py-3.5 flex justify-between items-center">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V6l7-3z"/></svg>
        </div>
        <span class="text-[17px] font-extrabold tracking-[-0.02em] text-white">ATTENDANCE</span>
        <span class="ml-2 hidden sm:inline-flex px-2.5 py-1 rounded-full bg-white/10 border border-white/10 text-[10px] font-bold tracking-widest text-white/70">BETA</span>
      </div>

      <!-- Links Pill -->
      <ul class="hidden md:flex items-center gap-1 bg-white/[0.06] border border-white/10 rounded-full p-1">
        <li><a href="#" class="px-5 py-2 rounded-full bg-white text-black font-semibold text-[13px]">Check In</a></li>
        <li><a href="#" class="px-5 py-2 rounded-full text-zinc-400 hover:text-white hover:bg-white/10 text-[13px] transition">History</a></li>
        <li><a href="#" class="px-5 py-2 rounded-full text-zinc-400 hover:text-white hover:bg-white/10 text-[13px] transition">Team</a></li>
        <li><p id="enrolled-count" class="px-3 text-[13px] text-zinc-500">&nbsp;</p></li>
      </ul>

      <!-- Admin Button -->
      <a href="/admin" class="group relative inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-white text-black font-bold text-[13px] hover:bg-zinc-100 transition">
        <span>Admin Panel</span>
        <span class="w-5 h-5 rounded-full bg-black text-white grid place-items-center group-hover:translate-x-0.5 transition">→</span>
      </a>
    </div>
  </nav>

  <div class="pointer-events-none fixed inset-x-0 top-0 h-[500px] bg-gradient-to-b from-indigo-100/80 via-violet-50/50 to-transparent"></div>

  <main class="relative mx-auto flex min-h-[calc(100vh-64px)] w-full max-w-lg flex-col px-5 py-8 sm:py-10">

    <!-- Header -->
    <header class="mb-6 flex items-start justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-600/10 border border-indigo-600/10 text-[11px] font-bold tracking-widest text-indigo-600">LIVE VERIFICATION</div>
        <h1 class="mt-3 text-[32px] font-[800] tracking-[-0.03em] leading-[0.9]">Check in</h1>
        <p class="mt-2 text-[14px] text-slate-500 leading-relaxed">Look at the camera and press scan.<br>One check-in per day.</p>
      </div>
      <div class="shrink-0 rounded-2xl bg-white border border-slate-200/70 shadow-lift px-4 py-3 text-right">
        <p id="clock" class="tnum text-xl font-bold leading-none tracking-tight">--:--</p>
        <p id="today" class="tnum mt-1 text-[11px] font-medium text-slate-500 uppercase tracking-widest">&nbsp;</p>
      </div>
    </header>

    <!-- Camera Card -->
    <section class="relative overflow-hidden rounded-[32px] bg-midnight shadow-frame border border-white/10 p-1.5">
      <div class="relative aspect-[4/5] w-full overflow-hidden rounded-[26px] bg-[#0b1120]">
        <video id="video" class="mirror h-full w-full object-cover" playsinline muted autoplay></video>

        <div id="camera-fallback" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-midnight px-8 text-center">
          <div class="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 grid place-items-center"><svg class="h-7 w-7 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8a2 2 0 0 1 2-2h3l1.6-2h6.8L17 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="12.5" r="3.6"/></svg></div>
          <p id="camera-fallback-text" class="max-w-xs text-[13px] leading-relaxed text-slate-400">Starting the camera…</p>
          <button id="retry-camera" type="button" class="hidden rounded-full bg-white text-black px-5 py-2 text-[13px] font-bold">Try again</button>
        </div>

        <div class="pointer-events-none absolute inset-x-[16%] inset-y-[13%] face-guide rounded-[24px]"></div>
        <div id="sweep" class="pointer-events-none absolute inset-0 hidden overflow-hidden" aria-hidden="true"></div>

        <div class="pointer-events-none absolute inset-x-0 bottom-0 flex justify-center p-4">
          <span id="cam-pill" class="inline-flex items-center gap-2 rounded-full bg-black/60 border border-white/10 px-3.5 py-1.5 text-[11px] font-bold tracking-wide text-white backdrop-blur-xl">
            <span id="cam-dot" class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="cam-status">Connecting</span>
          </span>
        </div>
      </div>
    </section>

    <!-- Action Button -->
    <button id="scan" type="button" disabled class="mt-6 group flex w-full items-center justify-center gap-2.5 rounded-[20px] bg-[#0b1120] px-6 py-[18px] text-[15px] font-bold text-white shadow-lift transition hover:bg-black active:scale-[.98] disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none">
      <span class="w-8 h-8 rounded-full bg-white/10 grid place-items-center group-disabled:bg-black/5">
        <svg id="scan-icon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/><path d="M9 10.5v.6M15 10.5v.6M9.3 15a3.6 3.6 0 0 0 5.4 0"/></svg>
      </span>
      <span id="scan-label">Scan face & mark attendance</span>
    </button>

    <div id="result" class="mt-5" role="status" aria-live="polite"></div>
  </main>

  <script src="/js/camera.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>
