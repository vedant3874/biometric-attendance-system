<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { ink: '#151b2e', midnight: '#0b1120', paper: '#f8f9ff', brand: { 500: '#6366f1', 600: '#4f46e5' } }, boxShadow: { lift: '0 4px 24px rgba(0,0,0,.06)' } } }
    }
  </script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
  .mirror{transform:scaleX(-1)}.face-guide{box-shadow:0 0 0 9999px rgba(10,10,15,.6) inset;border:1.5px dashed rgba(255,255,255,.55)}
  .nav-btn.active{background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.2)}.nav-btn:not(.active){color:#71717a}.nav-btn:not(.active):hover{background:rgba(255,255,255,.06);color:#fff}
  .thin-scroll::-webkit-scrollbar{width:5px;height:5px}.thin-scroll::-webkit-scrollbar-thumb{background:#e4e4e7;border-radius:10px}
  </style>
</head>

<body class="bg-[#f8f9ff] text-ink antialiased">
  <div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-[288px] -translate-x-full flex-col bg-[#08080c] border-r border-white/[0.06] transition-transform duration-300 lg:static lg:translate-x-0">
      <div class="flex items-center gap-3.5 px-7 py-7">
        <div class="flex h-10 w-10 items-center justify-center rounded-[12px] bg-white text-black shadow-lg">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8"/></svg>
        </div>
        <div>
          <p class="text-[13px] font-black tracking-[-0.01em] text-white">ATTENDANCE</p>
          <p class="text-[11px] font-medium text-zinc-500 -mt-0.5">Biometric OS</p>
        </div>
        <span class="ml-auto h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,.7)] animate-pulse"></span>
      </div>

      <nav class="flex-1 space-y-1 px-4">
        <button data-section="today" class="nav-btn active flex w-full items-center gap-3 rounded-xl px-4 py-3 text-[13.5px] font-semibold transition">
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Daily attendance
        </button>
        <button data-section="history" class="nav-btn flex w-full items-center gap-3 rounded-xl px-4 py-3 text-[13.5px] font-semibold transition">
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V9h4.5"/></svg> History
        </button>
        <button data-section="enroll" class="nav-btn flex w-full items-center gap-3 rounded-xl px-4 py-3 text-[13.5px] font-semibold transition">
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="8.5" r="3.5"/><path d="M3.8 19.5a6.4 6.4 0 0 1 12.4 0"/><path d="M18.5 7v5M21 9.5h-5"/></svg> Enroll user
        </button>
      </nav>

      <!-- User Card + Kiosk -->
      <div class="space-y-4 border-t border-white/[0.06] p-4">
        <div class="flex items-center gap-3 rounded-2xl bg-white/[0.05] border border-white/[0.06] px-4 py-3.5">
          <span id="signed-in-avatar" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-[12px] font-extrabold text-white">A</span>
          <div class="min-w-0 flex-1">
            <p id="signed-in-as" class="truncate text-[12.5px] font-bold text-white">&nbsp;</p>
            <p class="text-[10px] text-zinc-500">Administrator</p>
          </div>
          <button id="logout" type="button" class="rounded-full bg-white/10 p-2 text-zinc-400 hover:bg-white hover:text-black transition" title="Sign out">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>

        <div class="rounded-2xl bg-[#121217] border border-white/[0.06] p-4">
          <p id="side-meta" class="text-[11px] leading-relaxed text-zinc-400">&nbsp;</p>
          <a href="/" class="mt-3 flex w-full items-center justify-center gap-2 rounded-full bg-white px-4 py-2.5 text-[12px] font-bold text-black hover:bg-zinc-100 transition">Open kiosk <span>→</span></a>
        </div>
      </div>
    </aside>

    <div id="scrim" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden"></div>

    <!-- MAIN -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-20 border-b border-zinc-200/80 bg-white/75 backdrop-blur-xl px-6 py-4 sm:px-8">
        <div class="flex items-center gap-4">
          <button id="menu" class="rounded-xl bg-zinc-900 text-white p-2.5 lg:hidden"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div>
            <h1 id="page-title" class="text-[22px] font-[800] tracking-[-0.02em]">Daily attendance</h1>
            <p id="page-sub" class="mt-0.5 text-[13px] text-zinc-500">&nbsp;</p>
          </div>
          <button id="refresh" class="ml-auto hidden items-center gap-2 rounded-full border border-zinc-200 bg-white px-5 py-2.5 text-[13px] font-bold shadow-sm hover:bg-zinc-50 sm:inline-flex transition">
            <svg id="refresh-icon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V9h4.5"/></svg> Refresh
          </button>
        </div>
      </header>

      <main class="flex-1 px-6 py-7 sm:px-8 sm:py-8">
        <section id="section-today" class="section space-y-6">
          <div id="stats" class="grid grid-cols-2 gap-4 xl:grid-cols-4"></div>
          <div class="overflow-hidden rounded-[20px] border border-zinc-200 bg-white shadow-lift">
            <div class="flex items-center justify-between border-b border-zinc-100 px-6 py-4">
              <h2 class="text-[12px] font-black tracking-widest text-zinc-500">CHECKED IN TODAY</h2>
              <input id="date-picker" type="date" class="rounded-full border border-zinc-200 bg-zinc-50 px-4 py-2 text-[12px] font-bold outline-none focus:bg-white focus:border-black transition"/>
            </div>
            <div id="today-table" class="thin-scroll overflow-x-auto"></div>
          </div>
        </section>

        <section id="section-history" class="section hidden space-y-5">
          <div class="flex flex-wrap items-center gap-3">
            <div class="relative min-w-[300px] flex-1">
              <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <input id="history-search" type="search" placeholder="Search by name or date..." class="w-full rounded-full border border-zinc-200 bg-white py-3 pl-11 pr-4 text-[13px] font-medium outline-none focus:border-black focus:ring-4 focus:ring-zinc-100 placeholder:text-zinc-400 transition"/>
            </div>
            <button id="export-csv" class="inline-flex items-center gap-2 rounded-full bg-zinc-900 px-5 py-3 text-[13px] font-bold text-white hover:bg-black transition">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v10m0 0 3.5-3.5M12 14l-3.5-3.5M4.5 17.5v1A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-1"/></svg> Export CSV
            </button>
          </div>
          <div class="overflow-hidden rounded-[20px] border border-zinc-200 bg-white shadow-lift">
            <div id="history-table" class="thin-scroll max-h-[calc(100vh-260px)] overflow-auto"></div>
          </div>
        </section>

        <section id="section-enroll" class="section hidden">
          <div class="grid gap-6 lg:grid-cols-[420px_1fr]">
            <div class="rounded-[24px] border border-zinc-200 bg-white p-2 shadow-lift">
              <div class="relative overflow-hidden rounded-[20px] bg-[#08080c]">
                <div class="relative aspect-[4/5] w-full">
                  <video id="enroll-video" class="mirror h-full w-full object-cover" playsinline muted autoplay></video>
                  <div id="enroll-fallback" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-[#08080c] px-6 text-center">
                    <div class="w-12 h-12 rounded-full bg-white/10 grid place-items-center text-white">◉</div>
                    <p id="enroll-fallback-text" class="max-w-xs text-[13px] text-zinc-400">The camera starts when you open this section.</p>
                    <button id="enroll-start" type="button" class="rounded-full bg-white px-5 py-2.5 text-[13px] font-bold text-black">Start camera</button>
                  </div>
                  <div class="pointer-events-none absolute inset-x-[16%] inset-y-[13%] face-guide rounded-2xl"></div>
                  <div id="enroll-sweep" class="pointer-events-none absolute inset-0 hidden"></div>
                </div>
              </div>
              <div class="p-5 space-y-4">
                <div>
                  <label for="enroll-name" class="mb-2 block text-[11px] font-bold tracking-widest text-zinc-500">FULL NAME</label>
                  <input id="enroll-name" type="text" maxlength="80" placeholder="e.g. Ananya Deshmukh" class="w-full rounded-full border border-zinc-200 bg-zinc-50 px-5 py-3.5 text-[14px] font-medium outline-none focus:bg-white focus:border-black focus:ring-4 focus:ring-zinc-100 transition"/>
                </div>
                <p class="text-[11.5px] text-zinc-500">Face straight, even light, no glasses. One person only.</p>
                <button id="enroll-submit" type="button" disabled class="flex w-full items-center justify-center rounded-full bg-zinc-900 py-4 text-[14px] font-bold text-white hover:bg-black disabled:bg-zinc-100 disabled:text-zinc-400 transition">
                  <span id="enroll-label">Capture & enroll</span>
                </button>
                <div id="enroll-result" role="status" aria-live="polite"></div>
              </div>
            </div>

            <div class="overflow-hidden rounded-[20px] border border-zinc-200 bg-white shadow-lift">
              <div class="flex items-center justify-between border-b border-zinc-100 px-6 py-4">
                <h2 class="text-[12px] font-black tracking-widest text-zinc-500">ENROLLED Student</h2>
                <span id="users-count" class="rounded-full bg-zinc-900 text-white px-3 py-1 text-[11px] font-bold">0</span>
              </div>
              <div id="users-table" class="thin-scroll max-h-[calc(100vh-200px)] overflow-auto"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/camera.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      })
    })
  </script>
</body>
</html>
